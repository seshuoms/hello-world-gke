name: Docker Build & Deploy to GKE

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: hello-world-458306
  GAR_LOCATION: us-east1
  CLUSTER_NAME: hello-cluster
  DEPLOYMENT_NAME: hello-deployment
  REPOSITORY: hello-repo
  IMAGE: hello

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ env.PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

    - name: Build Docker image
      run: |
        docker build -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest .

    - name: Push Docker image
      run: |
        docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest

    - name: Set up GKE credentials
      run: |
        gcloud container clusters get-credentials $CLUSTER_NAME --region $GAR_LOCATION

    - name: Deploy to GKE
      run: |
        kubectl apply -f deployment.yaml
